# PulseGuard Agent Yapılandırma Dosyası

agent:
  host_id: "web-server-03"  # id of the host where the agent is running
  interval_seconds: 5       # interval for running the checks and sending events to the collector
  secret_key: "very-secret-signature-key-707" # secret key for signing the payloads sent to the collector

collector:
  url: "http://localhost:8081" # URL of the collector where the agent will send the events

checks:
  cpu:
    enabled: true           # is this check enabled or not
    threshold_warning: 20.0 # create a WARNING event if CPU usage exceeds 80%
    threshold_error: 35.0   # create an ERROR event if CPU usage exceeds 95%

  ram:
    enabled: true
    threshold_warning: 80.0
    threshold_error: 90.0

  disk:
    enabled: true
    path: "/"               # İzlenecek disk yolu (Windows için "C:\" olabilir)
    threshold_warning: 80.0
    threshold_error: 90.0